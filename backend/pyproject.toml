[project]
name = "bis-ai-backend"
version = "0.1.0"
description = "BIS AI backend — modular monolith (FastAPI). See docs/00_PROJECT_OVERVIEW.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.16",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "pypdf>=4,<6",
    "python-multipart>=0.0.18,<0.0.20",
    "argon2-cffi>=23,<24",
    "upstash-redis>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
